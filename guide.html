<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Radiescoon — Guide</title><link rel="icon" href="assets/icon.png"><style>
  :root{
    --nuit:#1B2A4A; --nuit-fonce:#141F38; --or:#9C7A23; --or-clair:#C9A24B;
    --sauge:#5E7355; --creme:#FBF9F3; --creme-2:#F1EBDC; --texte:#222222; --muted:#6A675E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--texte);background:var(--creme);line-height:1.6}
  a{color:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding:0 22px}

  header{position:sticky;top:0;z-index:20;background:rgba(251,249,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--creme-2)}
  header .wrap{display:flex;align-items:center;gap:12px;height:64px}
  header img{width:36px;height:36px;border-radius:9px}
  header .brand{font-weight:800;font-size:19px;letter-spacing:.2px;color:var(--nuit)}
  header .brand small{display:block;font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.3px}
  header nav{margin-left:auto;display:flex;gap:22px;font-size:14px;font-weight:600}
  header nav a{color:var(--muted);text-decoration:none}
  header nav a:hover{color:var(--nuit)}
  @media(max-width:640px){header nav{display:none}}

  .hero{background:linear-gradient(160deg,var(--nuit) 0%,var(--nuit-fonce) 100%);color:#fff;text-align:center;padding:72px 0 84px;position:relative;overflow:hidden}
  .hero .orb{position:absolute;opacity:.10;background:var(--or-clair);border-radius:50%}
  .hero .o1{width:260px;height:260px;top:-80px;left:-60px}
  .hero .o2{width:190px;height:190px;bottom:-70px;right:-50px}
  .hero .arc{position:absolute;left:50%;top:40px;width:520px;height:520px;margin-left:-260px;border:1px solid rgba(201,162,75,.18);border-radius:50%}
  .hero .arc.b{width:380px;height:380px;margin-left:-190px;top:110px}
  .hero .logo{width:98px;height:98px;border-radius:24px;box-shadow:0 12px 34px rgba(0,0,0,.32);margin-bottom:22px;position:relative}
  .hero .par{color:var(--or-clair);font-weight:700;font-size:14px;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;position:relative}
  .hero h1{font-size:44px;line-height:1.1;font-weight:800;letter-spacing:-.5px;position:relative}
  .hero .tagline{position:relative;color:var(--or-clair);font-style:italic;font-size:17px;margin-top:10px}
  .hero p.lead{max-width:640px;margin:18px auto 0;font-size:18px;color:#E4E7EE;position:relative}
  @media(max-width:640px){.hero h1{font-size:33px}.hero p.lead{font-size:16px}}

  .stores{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:32px;position:relative}
  .store{display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--nuit);font-weight:700;
    padding:13px 22px;border-radius:14px;text-decoration:none;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.20);transition:transform .15s}
  .store:hover{transform:translateY(-2px)}
  .store.soon{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.3)}
  .store .em{font-size:20px}
  .store small{display:block;font-weight:600;font-size:11px;opacity:.7}

  section{padding:66px 0}
  .eyebrow{color:var(--or);font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;text-align:center}
  h2{font-size:31px;font-weight:800;text-align:center;margin:8px 0 8px;letter-spacing:-.3px;color:var(--nuit)}
  .sub{text-align:center;color:var(--muted);max-width:660px;margin:0 auto 42px;font-size:16px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  @media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--creme-2);border-radius:18px;padding:26px 22px;transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(27,42,74,.10)}
  .card .em{font-size:30px;display:inline-block;margin-bottom:12px}
  .card h3{font-size:18px;font-weight:800;margin-bottom:7px;color:var(--nuit)}
  .card p{color:var(--muted);font-size:14.5px}

  .modules{background:var(--creme-2)}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:820px;margin:0 auto}
  .chip{background:#fff;border:1px solid #E4DCC6;color:var(--nuit);font-weight:700;font-size:14px;
    padding:9px 16px;border-radius:999px}
  .gabarits{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:820px;margin:38px auto 0}
  @media(max-width:640px){.gabarits{grid-template-columns:repeat(2,1fr)}}
  .gab{background:#fff;border:1px solid #E4DCC6;border-radius:16px;padding:20px 14px;text-align:center}
  .gab strong{display:block;color:var(--nuit);font-size:15px;margin-bottom:4px}
  .gab span{color:var(--muted);font-size:13px}

  .premium .box{background:#fff;border:1px solid #E7DFCB;border-radius:22px;padding:40px 34px;text-align:center;max-width:720px;margin:0 auto}
  .premium .price{display:inline-block;background:var(--or);color:#fff;font-weight:800;padding:6px 16px;border-radius:999px;font-size:14px;margin-bottom:14px}
  .premium h2{margin-top:0}
  .premium ul{list-style:none;display:inline-block;text-align:left;margin:18px auto 0;color:var(--texte)}
  .premium li{padding:5px 0 5px 30px;position:relative;font-size:15px}
  .premium li::before{content:"🔮";position:absolute;left:0}
  .premium .free{color:var(--muted);font-size:14px;margin-top:20px}
  .pay{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .paybtn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:12px;font-weight:800;
    font-size:15px;text-decoration:none;color:#fff;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 16px rgba(0,0,0,.16)}
  .paybtn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.22)}
  .paybtn.paypal{background:#0070ba}
  .paybtn.sumup{background:#1b2a4a}

  .privacy{background:var(--nuit);color:#E4E7EE;text-align:center}
  .privacy h2{color:#fff}
  .privacy .sub{color:#C6CEDC}

  footer{background:var(--nuit-fonce);color:#B7BFCF;text-align:center;padding:40px 0;font-size:13.5px}
  footer a{color:var(--or-clair);text-decoration:none}
  footer .disc{max-width:680px;margin:16px auto 0;font-size:12px;color:#8D96A8;line-height:1.5}

  /* Captures d'écran */
  .shots{background:var(--creme-2);padding:44px 0 48px;border-top:1px solid var(--creme-2);border-bottom:1px solid var(--creme-2)}
  .shots .inner{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;max-width:1040px;margin:0 auto;padding:0 22px;align-items:flex-start}
  .shots img{width:190px;height:auto;border-radius:20px;border:1px solid #E4DCC6;box-shadow:0 14px 38px rgba(27,42,74,.18);display:block}
  .shots figure{margin:0;text-align:center}
  .shots figcaption{margin-top:10px;font-size:12.5px;color:var(--muted);font-weight:600}
  @media(max-width:640px){.shots img{width:140px}.shots .inner{gap:12px}}
.doc{max-width:880px;margin:0 auto;padding:44px 22px 40px}.doc h1{font-size:40px;color:var(--nuit);font-weight:800;text-align:center}.doc .lead{text-align:center;color:var(--muted);max-width:660px;margin:8px auto 26px;font-size:17px}.doc h2{font-size:25px;margin:30px 0 6px;color:var(--nuit);text-align:left}.doc p,.doc li{color:var(--texte);font-size:16px}.doc ul{padding-left:22px;margin:8px 0}.doc .box{background:#fff;border-radius:16px;padding:20px 22px;border:1px solid var(--creme-2);margin:14px 0;box-shadow:0 6px 20px rgba(27,42,74,.05)}.doc .tip{background:#F1EBDC;border:1px solid var(--or-clair);border-radius:12px;padding:12px 14px;margin:12px 0}.doc .warn{background:#FBF3DE;border:1px solid var(--or);border-radius:12px;padding:12px 14px;margin:12px 0}.doc a{color:var(--or)}#rc-lang{background:transparent;border:1px solid var(--creme-2);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;margin-left:6px}</style></head><body><header><div class="wrap">
